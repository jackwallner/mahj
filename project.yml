name: MahjTrainer
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.72.0
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk.git
    exactVersion: 18.1.1
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  lastUpgradeCheck: "1600"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  MahjTrainer:
    type: application
    platform: iOS
    sources:
      - path: MahjTrainer
      - path: Shared
    settings:
      base:
        DEVELOPMENT_TEAM: YXG4MP6W39
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.mahj
        PRODUCT_NAME: "Mahj Trainer"
        PRODUCT_MODULE_NAME: MahjTrainer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.4.2"
        CURRENT_PROJECT_VERSION: "57"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MahjTrainer/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # Meta ad measurement (Shared/Services/MetaAds.swift). Empty = off: no
        # Meta SDK start, no ATT prompt. Fill both from the Meta app's
        # Settings > Basic and Advanced pages, in the same build that updates
        # the App Store privacy labels. See project-docs/marketing/meta-ads.md.
        META_APP_ID: "987930193620309"
        META_CLIENT_TOKEN: "9fbadb8693ddffb7ae0754d71bb2834c"
    dependencies:
      - package: RevenueCat
      - package: Facebook
        product: FacebookCore
      - sdk: AdSupport.framework
      - sdk: AppTrackingTransparency.framework

  MahjTrainerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MahjTrainerTests
    dependencies:
      - target: MahjTrainer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mahj Trainer.app/Mahj Trainer"

  # App Store screenshot capture. Deliberately NOT in the MahjTrainer scheme's
  # test action: it drives the real UI and takes a minute, and the unit-test
  # loop should stay instant. Drive it with scripts/capture-screenshots.sh.
  MahjTrainerScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MahjTrainerScreenshots
    dependencies:
      - target: MahjTrainer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MahjTrainer

schemes:
  MahjTrainer:
    build:
      targets:
        MahjTrainer: all
    run:
      config: Debug
      storeKitConfiguration: MahjTrainer/MahjTrainer.storekit
    test:
      config: Debug
      targets:
        - MahjTrainerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Screenshots:
    build:
      targets:
        MahjTrainer: all
        MahjTrainerScreenshots: [test]
    test:
      config: Debug
      # The test plan carries the StoreKit Testing configuration. It has to:
      # XcodeGen's `storeKitConfiguration` only reaches the scheme's RUN action,
      # and a UI test launches the app through the test runner, not through Run.
      # The Debug bridge also reads the bundled catalog directly because
      # xcodebuild does not consistently activate StoreKit test data.
      # The target identifiers inside the plan are XcodeGen's deterministic
      # hashes, so they survive `xcodegen generate`; renaming a target breaks it.
      testPlans:
        - path: MahjTrainerScreenshots/Screenshots.xctestplan
      targets:
        - MahjTrainerScreenshots
