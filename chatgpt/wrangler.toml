name = "mahj"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

# OPENAI_DOMAIN_CHALLENGE is a secret: `npx wrangler secret put OPENAI_DOMAIN_CHALLENGE`.

# The privacy policy promises no request logs: keep Workers Logs off.
[observability]
enabled = false
